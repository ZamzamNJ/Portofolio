            reverseSpin: {
              from: { transform: 'rotate(360deg)' },
              to: { transform: 'rotate(0deg)' }
            },
            manaShimmer: {
              '0%, 100%': { opacity: '0.4' },
              '50%': { opacity: '0.9' }

    const SwordIcon = ({ className = "w-5 h-5" }) => (

    const ShieldLawIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />

    const ScaleJusticeIcon = ({ className = "w-5 h-5" }) => (

        <path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z" />

    const SparklesIcon = ({ className = "w-5 h-5" }) => (

        <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" />

    const GrimoireIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">

        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />

        <path d="M9 12h6" />

    // --- Particle Mana Background Canvas ---
    const MagicParticleCanvas = () => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        const particleCount = 75;
        const particles = [];
        const runes = ['♠', '♣', '♦', '✦', '✧', '§', '¶', '⚖', '⚔', '5'];

        for (let i = 0; i < particleCount; i++) {
          particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: Math.random() * 2.5 + 0.8,
            speedY: -(Math.random() * 0.9 + 0.3),
            speedX: (Math.random() - 0.5) * 0.5,
            opacity: Math.random() * 0.7 + 0.2,
            pulseSpeed: Math.random() * 0.03 + 0.01,
            pulseVal: Math.random() * Math.PI,
            isRune: Math.random() > 0.82,
            runeChar: runes[Math.floor(Math.random() * runes.length)]
          });
        }

        let mouseX = width / 2;
        let mouseY = height / 2;
        const handleMouseMove = (e) => {
          mouseX = e.clientX;
          mouseY = e.clientY;
        };
        window.addEventListener('mousemove', handleMouseMove);

        const render = () => {
          ctx.clearRect(0, 0, width, height);

          const grad = ctx.createRadialGradient(mouseX, mouseY, 10, mouseX, mouseY, 500);
          grad.addColorStop(0, 'rgba(44, 103, 237, 0.07)');
          grad.addColorStop(1, 'rgba(3, 5, 10, 0)');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, width, height);

          particles.forEach((p) => {
            p.y += p.speedY;
            p.x += p.speedX;
            p.pulseVal += p.pulseSpeed;

            if (p.y < -30) {
              p.y = height + 20;
              p.x = Math.random() * width;
            }
            if (p.x < -20) p.x = width + 20;
            if (p.x > width + 20) p.x = -20;

            const currentOpacity = p.opacity * (0.6 + 0.4 * Math.sin(p.pulseVal));

            if (p.isRune) {
              ctx.font = '13px "Cinzel", serif';
              ctx.fillStyle = `rgba(96, 165, 250, ${currentOpacity * 0.85})`;
              ctx.shadowColor = '#2c67ed';
              ctx.shadowBlur = 10;
              ctx.fillText(p.runeChar, p.x, p.y);
              ctx.shadowBlur = 0;
            } else {
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
              ctx.fillStyle = `rgba(44, 103, 237, ${currentOpacity})`;
              ctx.shadowColor = '#60a5fa';
              ctx.shadowBlur = 12;
              ctx.fill();
              ctx.shadowBlur = 0;
            }
          });

          for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
              const dx = particles[i].x - particles[j].x;
              const dy = particles[i].y - particles[j].y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < 85) {
                ctx.beginPath();
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.strokeStyle = `rgba(44, 103, 237, ${0.12 * (1 - dist / 85)})`;
                ctx.lineWidth = 0.8;
                ctx.stroke();
              }
            }
          }

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('mousemove', handleMouseMove);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return (
        <canvas 
          ref={canvasRef} 
          className="fixed inset-0 pointer-events-none z-0 opacity-80"
        />
      );
    };

    // --- Typewriter Component with Alternating Roles ---
    const TypewriterRoles = ({ roles = [] }) => {
      const [currentRoleIndex, setCurrentRoleIndex] = useState(0);
      const [displayedText, setDisplayedText] = useState("");
      const [isDeleting, setIsDeleting] = useState(false);
      const [typingSpeed, setTypingSpeed] = useState(110);

      useEffect(() => {
        const fullText = roles[currentRoleIndex] || "";
        let timer;

        if (!isDeleting && displayedText === fullText) {
          timer = setTimeout(() => {
            setIsDeleting(true);
            setTypingSpeed(55);
          }, 1800);
        } else if (isDeleting && displayedText === "") {
          setIsDeleting(false);
          setCurrentRoleIndex((prev) => (prev + 1) % roles.length);
          setTypingSpeed(100);
        } else {
          timer = setTimeout(() => {
            setDisplayedText((prev) =>
              isDeleting ? fullText.substring(0, prev.length - 1) : fullText.substring(0, prev.length + 1)
            );
          }, typingSpeed);
        }

        return () => clearTimeout(timer);
      }, [displayedText, isDeleting, currentRoleIndex, roles, typingSpeed]);

      return (
        <span className="inline-flex items-center text-brand-400 font-mono font-bold tracking-wide">
          <span className="glow-blue-text">{displayedText}</span>
          <span className="w-1 h-7 md:h-8 bg-brand-400 ml-1.5 animate-pulse shadow-[0_0_10px_#2c67ed]"></span>
        </span>
      );
    };

        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);

        { id: 'experience', label: 'Pengalaman' },

        { id: 'portfolio', label: 'Portfolio' },

              </div>
              <div className="flex flex-col">
                <span className="font-serif font-bold text-sm tracking-widest text-white group-hover:text-brand-300 transition-colors">
                  ZAM ZAM<span className="text-brand-400">.SH</span>
                </span>
                <span className="text-[9px] uppercase tracking-wider text-slate-400 font-mono">
                  Grimoire of Law
                </span>
              </div>
            </a>

            {/* Desktop Navigation Links */}
            <div className="hidden lg:flex items-center gap-1 xl:gap-2">
              {navItems.map((item) => {
                const isActive = activeSection === item.id;
                return (
                  <a
                    key={item.id}
                    href={`#${item.id}`}
                    className={`relative px-3.5 py-1.5 text-xs font-semibold tracking-wider uppercase transition-all rounded-full

                        ? 'text-white bg-brand/20 shadow-[0_0_15px_rgba(44,103,237,0.5)] border border-brand/50' 
                        : 'text-slate-300 hover:text-white hover:bg-white/5'}
                    `}
                  >
                    {item.label}
                    {isActive && (
                      <span className="absolute bottom-0 left-1/2 -translate-x-1/2 w-3 h-0.5 bg-brand-400 rounded-full shadow-[0_0_8px_#2c67ed]" />

                );
              })}
            </div>

            {/* Grimoire Action / Consult Button */}
            <div className="flex items-center gap-2">
              <button
                onClick={onOpenGrimoire}
                title="Buka Grimoire Sila ke-5"
                className="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold font-mono bg-void-850 hover:bg-brand/20 border border-brand/40 text-brand-300 transition-all hover:shadow-[0_0_15px_rgba(44,103,237,0.4)]"
              >
                <GrimoireIcon className="w-3.5 h-3.5 text-brand-400" />
                <span>Grimoire</span>
              </button>

              <a
                href="#contact"
                className="relative inline-flex items-center justify-center px-4 py-1.5 text-xs font-bold tracking-wide text-white uppercase rounded-full overflow-hidden group bg-brand shadow-[0_0_18px_rgba(44,103,237,0.6)] hover:shadow-[0_0_28px_rgba(44,103,237,0.9)] transition-all transform hover:scale-105"
              >
                <span className="relative z-10 flex items-center gap-1.5">
                  <ShieldLawIcon className="w-3.5 h-3.5" />
                  <span>Konsultasi</span>
                </span>
                <div className="absolute inset-0 bg-gradient-to-r from-brand-600 via-brand-400 to-cyan-400 opacity-0 group-hover:opacity-100 transition-opacity duration-300" />
              </a>

              {/* Mobile Menu Toggle Button */}
              <button 
                onClick={() => setMobileMenuOpen(!mobileMenuOpen)}

                aria-label="Toggle menu"
              >
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  {mobileMenuOpen ? (

                  ) : (

                  )}
                </svg>
              </button>
            </div>
          </nav>

          {/* Mobile Dropdown Menu with Glow */}
          {mobileMenuOpen && (
            <div className="lg:hidden mt-2 p-4 rounded-2xl glass-panel shadow-[0_0_30px_rgba(44,103,237,0.45)] border border-brand/50 animate-fadeIn">
              <div className="flex flex-col gap-1.5">
                {navItems.map((item) => (
                  <a
                    key={item.id}
                    href={`#${item.id}`}
                    onClick={() => setMobileMenuOpen(false)}
                    className="px-4 py-2 text-sm font-medium rounded-lg text-slate-300 hover:text-white hover:bg-brand/20 transition-all flex items-center justify-between"
                  >

                <button

    // --- Interactive 5-Leaf Clover Grimoire Modal (Black Clover Theme Easter Egg) ---

      if (!isOpen) return null;

      const leaves = [
        { number: '1', title: 'Integritas & Etika Yudisial', desc: 'Fondasi utama seorang praktisi hukum dalam menjaga rahasia jabatan, objektivitas perkara, dan marwah institusi keadilan.' },

        { number: '3', title: 'Kepatuhan Regulasi & Keadilan', desc: 'Memastikan seluruh operasional korporasi dan proses administrasi peradilan selaras dengan hukum positif dan asas-asas peradilan yang baik.' },

        { number: '5', title: 'Tekad Pantang Menyerah (Asta Will)', desc: 'Di dalam daun kelima bersemayam semangat pantang menyerah untuk terus belajar, meneliti kasus, dan membela keadilan tanpa kompromi!' }
      ];

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
          <div 
            className="relative w-full max-w-2xl rounded-2xl p-6 md:p-8 bg-void-900 border-2 border-brand shadow-[0_0_60px_rgba(44,103,237,0.7)] animate-scaleUp overflow-hidden"
            style={{
              backgroundImage: 'radial-gradient(circle at top right, rgba(44,103,237,0.18), transparent 70%)'
            }}
          >
            <div className="absolute -top-16 -right-16 w-56 h-56 rounded-full border border-brand/20 animate-spin-slow pointer-events-none" />
            <div className="absolute -top-16 -right-16 w-44 h-44 rounded-full border border-dashed border-brand/30 animate-reverse-spin pointer-events-none" />

            <div className="flex items-start justify-between pb-4 border-b border-brand/30">
              <div className="flex items-center gap-3">
                <FiveLeafClover className="w-10 h-10 text-brand-400" />
                <div>
                  <h3 className="font-serif text-xl font-bold text-white tracking-wide flex items-center gap-2">
                    THE 5-LEAF GRIMOIRE OF LAW
                  </h3>
                  <p className="text-xs text-brand-300 font-mono">
                    "Filosofi Ksatria Sihir Hukum - Pantang Menyerah Menjaga Keadilan"
                  </p>
                </div>
              </div>

            setDimensions({ width: rect.width || 320, height: rect.height || 384 });
          }
        };
        updateDims();
        window.addEventListener('resize', updateDims);
        return () => window.removeEventListener('resize', updateDims);
      }, []);

      const handlePointerMove = (clientX, clientY) => {
        if (!containerRef.current) return;
        const rect = containerRef.current.getBoundingClientRect();
        const x = clientX - rect.left;
        const y = clientY - rect.top;
        setCursorPos({ x, y });
        setIsActive(true);
      };

      const handleMouseMove = (e) => {
        handlePointerMove(e.clientX, e.clientY);
      };

      const handleTouchMove = (e) => {
        const touch = e.touches[0];
        if (touch) handlePointerMove(touch.clientX, touch.clientY);
      };

      const handleLeave = () => {
        setIsActive(false);
      };

      const lensDiameter = lensRadius * 2;

      return (
        <div className="flex flex-col items-center">

            <div 
              ref={containerRef}
              onMouseMove={handleMouseMove}
              onMouseEnter={() => setIsActive(true)}
              onMouseLeave={handleLeave}
              onTouchStart={(e) => {
                const t = e.touches[0];
                if (t) handlePointerMove(t.clientX, t.clientY);
              }}

              onTouchEnd={handleLeave}

                        <option value="Kerja Sama Akademik & Pelatihan Peradilan Semu">Kerja Sama Akademik & Pelatihan Peradilan Semu</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-mono text-slate-300 mb-1.5 uppercase">
                        Deskripsi Singkat / Rincian Pesan *
                      </label>
                      <textarea
                        name="message"
                        required
                        rows="4"
                        value={formData.message}
                        onChange={handleChange}
                        placeholder="Jelaskan kebutuhan hukum Anda, jenis perjanjian yang diperlukan, batas waktu (deadline), atau pertanyaan spesifik..."
                        className="w-full px-4 py-2.5 rounded-xl bg-void-950 border border-slate-800 focus:border-brand focus:ring-1 focus:ring-brand text-white text-xs sm:text-sm outline-none transition-colors resize-none"
                      ></textarea>
                    </div>

                    <button
                      type="submit"
                      disabled={isSubmitting}
                      className="w-full py-3.5 rounded-xl font-bold text-xs sm:text-sm uppercase tracking-wider text-white bg-brand hover:bg-brand-600 transition-all duration-300 shadow-[0_0_20px_rgba(44,103,237,0.6)] hover:shadow-[0_0_35px_rgba(44,103,237,0.9)] flex items-center justify-center gap-2"
                    >
                      {isSubmitting ? (
                        <>
                          <svg className="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                            <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                            <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                          </svg>
                          <span>Mengirimkan Pesan Bersegel...</span>
                        </>
                      ) : (
                        <>
                          <ScaleJusticeIcon className="w-4 h-4" />
                          <span>Kirim Permohonan Konsultasi</span>
                        </>
                      )}
                    </button>
                  </form>

                </div>
              </div>

            </div>
          </div>
        </section>
      );
    };

    // --- Footer ---
    const Footer = ({ onOpenGrimoire }) => (
      <footer className="py-12 px-4 border-t border-brand/20 bg-void-950 relative">
        <div className="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6 text-center md:text-left">
          
          <div className="flex items-center gap-3">
            <FiveLeafClover className="w-8 h-8 text-brand-400" />
            <div>
              <div className="font-serif font-bold text-base text-white tracking-wider">
                ZAM ZAM NURJAMAN, S.H., CCD
              </div>
              <div className="text-[11px] text-slate-400 font-mono">
                Legal Professional & Certified Contract Drafter • Clover Kingdom Aesthetic
              </div>
            </div>
          </div>

          <div className="flex items-center gap-4 text-xs font-mono text-slate-400">
            <a href="#hero" className="hover:text-brand-300 transition-colors">Beranda</a>
            <span>•</span>
            <a href="#about" className="hover:text-brand-300 transition-colors">About</a>
            <span>•</span>
            <a href="#portfolio" className="hover:text-brand-300 transition-colors">Portfolio</a>
            <span>•</span>
            <button onClick={onOpenGrimoire} className="hover:text-brand-300 text-brand-400 transition-colors">
              5-Leaf Grimoire
            </button>
          </div>

          <div className="text-xs text-slate-500 font-mono">
            &copy; 2026 Zam Zam Nurjaman, S.H., CCD. All rights reserved.
            <div className="text-[10px] text-slate-600">Built with React + Tailwind CSS + Anime Black Clover Theme</div>
          </div>

        </div>
      </footer>
    );

    // --- Main App Root ---
    const App = () => {
      const [activeSection, setActiveSection] = useState('hero');
      const [grimoireOpen, setGrimoireOpen] = useState(false);

      useEffect(() => {
        const sections = ['hero', 'about', 'education', 'experience', 'achievements', 'portfolio', 'contact'];
        const handleScroll = () => {
          const scrollPos = window.scrollY + 200;
          for (const sec of sections) {
            const el = document.getElementById(sec);
            if (el) {
              const top = el.offsetTop;
              const height = el.offsetHeight;
              if (scrollPos >= top && scrollPos < top + height) {
                setActiveSection(sec);
                break;
              }
            }
          }
        };

        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      return (
        <div className="relative min-h-screen bg-void-950 text-slate-100 overflow-x-hidden">
          <MagicParticleCanvas />

          <FloatingNavbar 
            activeSection={activeSection} 
            onOpenGrimoire={() => setGrimoireOpen(true)} 
          />

          <main>
            <HeroSection onOpenGrimoire={() => setGrimoireOpen(true)} />
            <AboutSection />
            <EducationSection />
            <ExperienceSection />
            <AchievementsSection />
            <PortfolioSection />
            <ContactSection />
          </main>

          <Footer onOpenGrimoire={() => setGrimoireOpen(true)} />

          <GrimoireModal 
            isOpen={grimoireOpen} 
            onClose={() => setGrimoireOpen(false)} 
          />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
